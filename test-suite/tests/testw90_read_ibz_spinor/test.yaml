# testw90_read_ibz_spinor

description: "GaAs with spin-orbit coupling, 8 sp3 spinor valence Wannier functions from the IBZ files (read_ibz)"
profile: wannier90_wout
runs:
  - input: GaAs.win
    output: GaAs.wout
prepare:
  - bunzip2: "*.isym.bz2"
  - bunzip2: "*.immn.bz2"
  - bunzip2: "*.iamn.bz2"
  - bunzip2: "*.ieig.bz2"
