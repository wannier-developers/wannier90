# testpostw90_pt_shc_ryoo

description: "Test of Ryoo's methods of SHC for fcc platinum"
profile: postw90_shc_freq_dat
runs:
  - input: Pt.win
    output: Pt-shc-freqscan.dat
prepare:
  - chk_from_bz2: "*.chk.fmt.bz2"
  - bunzip2: "*.mmn.bz2"
  - bunzip2: "*.amn.bz2"
  - bunzip2: "*.spn.bz2"
  - bunzip2: "*.sHu.bz2"
  - bunzip2: "*.sIu.bz2"
