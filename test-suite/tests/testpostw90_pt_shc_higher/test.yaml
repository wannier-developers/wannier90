# testpostw90_pt_shc_higher

description: Test for the spin hall conductivity using higher-order finite difference
profile: postw90_shc_fermi_dat
runs:
  - input: Pt.win
    output: Pt-shc-fermiscan.dat
prepare:
  - chk_from_bz2: "*.chk.fmt.bz2"
  - bunzip2: "*.mmn.bz2"
  - bunzip2: "*.amn.bz2"
  - bunzip2: "*.spn.bz2"
