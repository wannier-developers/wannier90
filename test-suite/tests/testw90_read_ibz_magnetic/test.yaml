# testw90_read_ibz_magnetic

description: "Ferromagnetic fcc Ni with spin-orbit coupling, 10 d spinor Wannier functions from the IBZ files (read_ibz); no time-reversal symmetry"
profile: wannier90_wout
runs:
  - input: Ni.win
    output: Ni.wout
prepare:
  - bunzip2: "*.isym.bz2"
  - bunzip2: "*.immn.bz2"
  - bunzip2: "*.iamn.bz2"
  - bunzip2: "*.ieig.bz2"
