[pytest]
# Plain `pytest` runs the regression suite. The unit tests for the harness itself live in
# w90testlib/tests/ and are run explicitly: `pytest w90testlib`.
testpaths = tests
addopts = -ra --strict-markers
# The markers are registered in conftest.py, not here, so that they are known even when
# pytest is invoked from somewhere that makes it pick a different rootdir and skip this
# file.  Add a marker of your own here if you use `tags:` in a test.yaml.
